<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="tasarim.css" />
  </head>
  <body>
    <header>
      <h1>Bootstrap</h1>
      <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Placeat,
        excepturi aperiam nesciunt harum adipisci, repellendus autem enim
        provident delectus aliquid perspiciatis distinctio velit eligendi
        exercitationem. Odit magni ex nemo. Libero?
      </p>
    </header>

    <!-- Yeşil, Sarı ve Kırmızı butonlar yaratıldı -->
    <div>
      <button class="btn btn-success girisYapB">Giriş Yap</button>
      <button class="btn btn-warning">Düzenle</button>
      <button class="btn btn-danger">Sil</button>
    </div>

    <br />

    <!-- A etiketi ile buton class'ı vererek çalışıldı -->
    <a class="btn btn-primary" target="_blank" href="https://www.google.com"
      >Daha Fazla Bilgi İçin</a
    >

    <br />

    <!-- Outline Buton Örnek -->
    <div>
      <button class="btn btn-outline-secondary outlineBu">Outline</button>
    </div>

    <br />

    <!-- Büyük ve Küçük buton testi yapıldı. -->
    <div>
      <button class="btn btn-primary btn-lg">Büyük Buton</button>
      <button class="btn btn-primary" disabled>Normal Buton</button>
      <button class="btn btn-primary btn-sm">Küçük Buton</button>
    </div>

    <br />

    <!-- Blok Tipinden Buton Örneği -->
    <div class="d-grid gap-2">
      <button class="btn btn-primary" type="button">Button</button>
      <button class="btn btn-primary" type="button">Button</button>
    </div>

    <br />

    <div class="btn-group" role="group" aria-label="Basic example">
      <button type="button" class="btn btn-success">Left</button>
      <button type="button" class="btn btn-warning">Middle</button>
      <button type="button" class="btn btn-outline-success">Middle</button>
      <button type="button" class="btn btn-dark">Right</button>
    </div>

    <br />

    <div
      class="btn-group checkboxButonlar"
      role="group"
      aria-label="Basic checkbox toggle button group"
    >
      <input
        type="checkbox"
        class="btn-check"
        id="btncheck1"
        autocomplete="off"
      />
      <label class="btn btn-outline-primary" for="btncheck1">Romantik</label>

      <input
        type="checkbox"
        class="btn-check"
        id="btncheck2"
        autocomplete="off"
      />
      <label class="btn btn-outline-primary" for="btncheck2">Komedi</label>

      <input
        type="checkbox"
        class="btn-check"
        id="btncheck3"
        autocomplete="off"
      />
      <label class="btn btn-outline-primary" for="btncheck3">Korku</label>
    </div>

    <br />

    <div
      class="btn-group checkboxButonlar"
      role="group"
      aria-label="Basic radio toggle button group"
    >
      <input
        type="radio"
        class="btn-check"
        name="btnradio"
        id="btnradio1"
        autocomplete="off"
      />
      <label class="btn btn-outline-primary" for="btnradio1">Radio 1</label>

      <input
        type="radio"
        class="btn-check"
        name="btnradio"
        id="btnradio2"
        autocomplete="off"
        checked
      />
      <label class="btn btn-outline-primary" for="btnradio2">Radio 2</label>

      <input
        type="radio"
        class="btn-check"
        name="btnradio"
        id="btnradio3"
        autocomplete="off"
      />
      <label class="btn btn-outline-primary" for="btnradio3">Radio 3</label>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
