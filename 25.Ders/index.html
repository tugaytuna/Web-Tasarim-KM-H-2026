<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>25.Ders</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body id="tumekran">
    <header>
      <h1>25.Ders</h1>
      <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Quis, ea illum
        eaque tenetur, facere quaerat accusamus minima voluptatem soluta fugit
        nulla corporis nobis. In commodi iure, ut consectetur corrupti hic.
      </p>
      <hr />
    </header>

    <div class="kayit-giris">
      <form onsubmit="girisyap()">
        <div class="mb-3">
          <label for="exampleInputEmail1" class="form-label"
            >Email adresi</label
          >
          <input
            type="email"
            class="form-control"
            id="exampleInputEmail1"
            aria-describedby="emailHelp"
          />
          <div id="emailHelp" class="form-text">
            Email adresi 3. kişiler ile paylaşılmayacaktır.
          </div>
        </div>
        <div class="mb-3">
          <label for="exampleInputPassword1" class="form-label">Şifre</label>
          <input
            type="password"
            class="form-control"
            id="exampleInputPassword1"
          />
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="exampleCheck1" />
          <label class="form-check-label" for="exampleCheck1"
            >Beni hatırla</label
          >
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>

      <div class="renksecici">
        <label for="exampleColorInput" class="form-label"
          >Arkaplan Rengini Seçiniz</label
        >
        <input
          type="color"
          class="form-control form-control-color"
          id="exampleColorInput"
          value="#563d7c"
          title="Choose your color"
        />
        <button onclick="renkdegis()" class="btn btn-success">Kaydet</button>

        <form class="row gy-2 gx-3 align-items-center">
          <div class="col-auto">
            <label class="visually-hidden" for="autoSizingInput">Name</label>
            <input
              type="text"
              class="form-control"
              id="autoSizingInput"
              placeholder="Tugay Tuna"
            />
          </div>
          <div class="col-auto">
            <label class="visually-hidden" for="autoSizingInputGroup"
              >Username</label
            >
            <div class="input-group">
              <div class="input-group-text">@</div>
              <input
                type="text"
                class="form-control"
                id="autoSizingInputGroup"
                placeholder="kullanıcı adı"
              />
            </div>
          </div>
          <div class="col-auto">
            <label class="visually-hidden" for="autoSizingSelect"
              >Preference</label
            >
            <select class="form-select" id="autoSizingSelect">
              <option selected>Seçiniz...</option>
              <option value="1">Html</option>
              <option value="2">Css</option>
              <option value="3">Javascript</option>
            </select>
          </div>
          <div class="col-auto">
            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="autoSizingCheck"
              />
              <label class="form-check-label" for="autoSizingCheck">
                Sözleşmeyi kabul ediyorum.
              </label>
            </div>
          </div>
          <div class="col-auto">
            <button type="submit" class="btn btn-primary">Kayıt Ol</button>
          </div>
        </form>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="kod.js"></script>
  </body>
</html>
